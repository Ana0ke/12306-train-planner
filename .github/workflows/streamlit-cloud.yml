name: Streamlit Cloud Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify app runs
        run: |
          pip install -r requirements.txt
          python -c "import streamlit; print('Streamlit OK')"
          python -c "from core.planner import RoutePlanner; print('Core OK')"
          python -c "from api.demo_data import get_demo_routes; print('Demo OK')"
